<h2 class="section-title" appReveal>{{ 'skills.title' | translate }}</h2>

<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4">
  <div *ngFor="let s of skills; let i = index" appReveal [revealDelay]="i * 60">
    <div class="skill-card glass card-lift group p-4 flex flex-col items-center gap-3"
      [ngStyle]="{ '--skill-color': s.color }">
      <div class="h-9 w-9 rounded-lg transition-transform duration-500 ease-out-expo group-hover:scale-110 group-hover:rotate-6"
        [ngStyle]="{ background: s.color, 'box-shadow': '0 0 18px ' + s.color + '55' }"></div>
      <div class="text-sm">{{ s.name }}</div>
    </div>
  </div>
</div>

<div class="mt-8 grid sm:grid-cols-2 gap-4">
  <div *ngFor="let group of groups; let i = index" appReveal [revealDelay]="(i % 2) * 80">
    <div class="glass h-full p-5">
      <div class="text-sm font-medium text-accent-400 mb-3 font-mono">{{ group.titleKey | translate }}</div>
      <div class="flex flex-wrap gap-2">
        <span *ngFor="let item of group.items" class="chip text-xs hover:border-accent/40 hover:text-white">{{ item }}</span>
      </div>
    </div>
  </div>
</div>
