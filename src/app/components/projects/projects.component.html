<div class="projects-section">
  <h2 class="section-title" appReveal>{{ 'projects.title' | translate }}</h2>
  <p class="text-white/60 mb-12 text-sm md:text-base max-w-2xl" appReveal [revealDelay]="80">
    {{ 'projects.subtitle' | translate }}
  </p>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let project of projects; let i = index" class="project-card" appReveal [revealDelay]="(i % 3) * 100">
      <div class="glass card-lift group overflow-hidden relative h-full flex flex-col hover:!border-accent/30 hover:!shadow-glow-lg">
        <div class="aspect-video bg-gradient-to-br from-accent/20 via-accent-600/10 to-transparent relative overflow-hidden">
          <img [src]="project.imageUrl" [alt]="project.name | translate" loading="lazy"
            class="absolute inset-0 w-full h-full object-cover object-top opacity-80 transition-[transform,opacity] duration-700 ease-out-expo group-hover:opacity-100 group-hover:scale-105" />
          <div class="absolute inset-0 bg-gradient-to-t from-[#0b0d10]/70 via-transparent to-transparent"></div>
        </div>

        <div class="p-6 flex-1 flex flex-col">
          <h3 class="text-xl font-semibold mb-2 transition-colors duration-300 group-hover:text-accent-400">
            {{ project.name | translate }}
          </h3>
          <p class="text-white/60 text-sm mb-6 flex-1">
            {{ project.description | translate }}
          </p>
          <a [href]="project.url" target="_blank" rel="noopener noreferrer"
            class="btn-ghost w-full justify-center group-hover:border-accent/50 group-hover:text-accent-400">
            <span>{{ 'projects.visit' | translate }}</span>
            <svg class="w-4 h-4 transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
