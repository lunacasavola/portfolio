<h2 class="section-title" appReveal>{{ 'summary.title' | translate }}</h2>

<div appReveal [revealDelay]="100">
  <div class="glass p-6 md:p-8 leading-relaxed text-white/80 space-y-4">
    <p>{{ 'summary.p1' | translate }}</p>
    <p>{{ 'summary.p2' | translate }}</p>
    <p>{{ 'summary.p3' | translate }}</p>
    <div class="pt-4 border-t border-white/10">
      <div class="text-sm font-medium text-white/90 mb-1">{{ 'summary.interestsTitle' | translate }}</div>
      <p class="text-white/60 text-sm">{{ 'summary.interests' | translate }}</p>
    </div>
  </div>
</div>
