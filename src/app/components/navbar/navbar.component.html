<nav class="fixed inset-x-0 top-0 z-50">
  <div class="mx-auto max-w-6xl px-4 md:px-6">
    <div class="mt-3"></div>
    <div class="glass flex items-center justify-between px-4 py-3 transition" [ngClass]="{ 'bg-white/10': isScrolled }">
      <div class="flex items-center gap-3">
        <div class="h-3 w-3 rounded-full bg-[#00ff41] animate-glow"></div>
        <span class="font-semibold tracking-tight">{{ 'hero.title' | translate }}</span>
      </div>
      <div class="hidden md:flex items-center gap-6 text-sm text-white/80">
        <button class="hover:text-[#33ff66] transition-colors relative group" (click)="scrollTo('hero')">
          {{ 'nav.home' | translate }}
          <span class="absolute bottom-0 left-0 w-0 h-px bg-[#33ff66] group-hover:w-full transition-all duration-300"></span>
        </button>
        <button class="hover:text-[#33ff66] transition-colors relative group" (click)="scrollTo('info')">
          {{ 'nav.info' | translate }}
          <span class="absolute bottom-0 left-0 w-0 h-px bg-[#33ff66] group-hover:w-full transition-all duration-300"></span>
        </button>
        <button class="hover:text-[#33ff66] transition-colors relative group" (click)="scrollTo('summary')">
          {{ 'nav.summary' | translate }}
          <span class="absolute bottom-0 left-0 w-0 h-px bg-[#33ff66] group-hover:w-full transition-all duration-300"></span>
        </button>
        <button class="hover:text-[#33ff66] transition-colors relative group" (click)="scrollTo('skills')">
          {{ 'nav.skills' | translate }}
          <span class="absolute bottom-0 left-0 w-0 h-px bg-[#33ff66] group-hover:w-full transition-all duration-300"></span>
        </button>
        <button class="hover:text-[#33ff66] transition-colors relative group" (click)="scrollTo('projects')">
          {{ 'nav.projects' | translate }}
          <span class="absolute bottom-0 left-0 w-0 h-px bg-[#33ff66] group-hover:w-full transition-all duration-300"></span>
        </button>
        <button class="hover:text-[#33ff66] transition-colors relative group" (click)="scrollTo('experience')">
          {{ 'nav.experience' | translate }}
          <span class="absolute bottom-0 left-0 w-0 h-px bg-[#33ff66] group-hover:w-full transition-all duration-300"></span>
        </button>
        <button class="hover:text-[#33ff66] transition-colors relative group" (click)="scrollTo('contact')">
          {{ 'nav.contact' | translate }}
          <span class="absolute bottom-0 left-0 w-0 h-px bg-[#33ff66] group-hover:w-full transition-all duration-300"></span>
        </button>
      </div>
      <div class="flex items-center gap-2">
        <button class="chip" (click)="setLang('en')">EN</button>
        <button class="chip" (click)="setLang('es')">ES</button>
      </div>
    </div>
  </div>
</nav>
