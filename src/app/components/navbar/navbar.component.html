<nav class="fixed inset-x-0 top-0 z-50 animate-[hero-in_0.8s_cubic-bezier(0.16,1,0.3,1)_both]">
  <div class="mx-auto max-w-6xl px-4 md:px-6 pt-3">
    <div class="glass flex items-center justify-between px-4 py-3 transition-colors duration-300"
      [ngClass]="isScrolled ? 'bg-[#0b0d10]/70 border-white/15' : ''">
      <button class="flex items-center gap-3" (click)="scrollTo('hero')">
        <span class="h-3 w-3 rounded-full bg-accent animate-glow"></span>
        <span class="font-semibold tracking-tight">{{ 'hero.title' | translate }}</span>
      </button>

      <div class="hidden lg:flex items-center gap-6 text-sm">
        <button *ngFor="let link of links"
          class="relative py-1 transition-colors duration-200"
          [ngClass]="activeSection === link.id ? 'text-accent-400' : 'text-white/70 hover:text-white'"
          (click)="scrollTo(link.id)">
          {{ link.key | translate }}
          <span class="absolute -bottom-0.5 left-0 h-px w-full bg-accent-400 origin-left transition-transform duration-300 ease-out-expo"
            [ngClass]="activeSection === link.id ? 'scale-x-100' : 'scale-x-0'"></span>
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button class="chip" [class.chip-active]="currentLang === 'en'" (click)="setLang('en')">EN</button>
        <button class="chip" [class.chip-active]="currentLang === 'es'" (click)="setLang('es')">ES</button>
        <button class="lg:hidden ml-1 w-9 h-9 grid place-items-center rounded-lg hover:bg-white/10 transition-colors"
          (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-label="Menu">
          <span class="relative block w-5 h-3.5">
            <span class="absolute left-0 top-0 h-0.5 w-full bg-white rounded transition-transform duration-300"
              [ngClass]="menuOpen ? 'translate-y-[6px] rotate-45' : ''"></span>
            <span class="absolute left-0 top-[6px] h-0.5 w-full bg-white rounded transition-opacity duration-200"
              [ngClass]="menuOpen ? 'opacity-0' : ''"></span>
            <span class="absolute left-0 top-3 h-0.5 w-full bg-white rounded transition-transform duration-300"
              [ngClass]="menuOpen ? '-translate-y-[6px] -rotate-45' : ''"></span>
          </span>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div class="lg:hidden grid transition-[grid-template-rows,opacity] duration-300 ease-out-expo"
      [ngClass]="menuOpen ? 'grid-rows-[1fr] opacity-100 mt-2' : 'grid-rows-[0fr] opacity-0 pointer-events-none'">
      <div class="overflow-hidden">
        <div class="glass !bg-[#0b0d10]/90 p-2 flex flex-col">
          <button *ngFor="let link of links"
            class="text-left px-3 py-2.5 rounded-lg transition-colors"
            [ngClass]="activeSection === link.id ? 'text-accent-400 bg-white/5' : 'text-white/80 hover:bg-white/5'"
            (click)="scrollTo(link.id)">
            {{ link.key | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
