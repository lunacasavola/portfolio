<h2 class="section-title" appReveal>{{ 'info.title' | translate }}</h2>

<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
  <div *ngFor="let item of items; let i = index" appReveal [revealDelay]="i * 70">
    <div class="glass card-lift h-full p-4 flex items-center gap-3">
      <span class="h-2 w-2 shrink-0 rounded-full bg-accent shadow-glow"></span>
      <div class="text-sm min-w-0">
        <div class="text-white/60">{{ item.label | translate }}</div>
        <div class="font-medium truncate">
          <a *ngIf="item.href; else plain" class="link-glow" [href]="item.href">{{ item.value }}</a>
          <ng-template #plain>{{ item.value | translate }}</ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
