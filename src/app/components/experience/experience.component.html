<h2 class="section-title" appReveal>{{ 'experience.title' | translate }}</h2>

<div class="relative">
  <!-- Timeline line, centered on the dots (left 6px = half of the 12px dot) -->
  <div class="absolute left-[5.5px] top-2 bottom-2 w-px bg-gradient-to-b from-accent/60 via-white/10 to-transparent"></div>
  <div class="space-y-8">
    <div *ngFor="let item of items; let i = index" class="relative pl-8 md:pl-10" appReveal [revealDelay]="i * 100">
      <span class="absolute left-0 top-5 h-3 w-3 rounded-full bg-accent shadow-glow ring-4 ring-[#0b0d10]"></span>
      <div class="glass p-5 md:p-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1">
          <div class="font-semibold text-lg">{{ item.company | translate }}</div>
          <div class="text-xs font-mono text-accent-400/80">{{ item.period | translate }}</div>
        </div>
        <div class="text-white/80">{{ item.role | translate }}</div>
        <div class="text-xs text-white/50 mt-0.5">{{ item.location | translate }}</div>
        <ul class="mt-4 space-y-2 text-sm text-white/60">
          <li *ngFor="let highlight of item.highlights" class="flex gap-2">
            <span class="text-accent/70 font-mono shrink-0">▹</span>
            <span>{{ highlight | translate }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
