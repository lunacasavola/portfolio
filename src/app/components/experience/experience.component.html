<h2 class="section-title">{{ 'experience.title' | translate }}</h2>

<div class="relative">
  <div class="absolute left-4 top-0 bottom-0 w-px bg-white/10"></div>
  <div class="space-y-6">
    <div *ngFor="let item of items" class="relative pl-10">
      <div class="absolute left-0 top-2 h-3 w-3 rounded-full bg-[#00ff41] shadow-glow"></div>
      <div class="glass p-4">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1">
          <div class="font-semibold">{{ item.company | translate }}</div>
          <div class="text-xs text-white/60">{{ item.period | translate }}</div>
        </div>
        <div class="text-white/80">{{ item.role | translate }}</div>
        <div class="text-xs text-white/50 mt-0.5">{{ item.location | translate }}</div>
        <ul class="mt-3 space-y-2 text-sm text-white/60 list-disc pl-4">
          <li *ngFor="let highlight of item.highlights">{{ highlight | translate }}</li>
        </ul>
      </div>
    </div>
  </div>
</div>
